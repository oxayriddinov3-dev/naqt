<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do‘kon — Tovarlar va Savat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

  <!-- Yuqori panel -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500 text-slate-950 flex items-center justify-center text-xl font-extrabold shadow">
          <i class="fas fa-shopping-bag"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-extrabold tracking-tight">ONLAYN DO‘KON</h1>
          <p class="text-xs text-slate-400">Admin belgilagan tovarlar va narxlar</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <a href="admin.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-xl border border-slate-700 transition flex items-center space-x-1.5">
          <i class="fas fa-user-shield text-emerald-400"></i>
          <span>Admin ilovasi</span>
        </a>

        <button onclick="toggleCart(true)" class="relative bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs sm:text-sm font-extrabold px-4 py-2 rounded-xl shadow transition flex items-center space-x-2">
          <i class="fas fa-shopping-cart"></i>
          <span>Savat</span>
          <span id="cart-badge" class="bg-slate-950 text-emerald-400 text-xs font-extrabold px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Asosiy kontent -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h2 class="text-lg font-extrabold text-slate-900">Tovarlar katalogi</h2>
      <input id="search-input" oninput="renderCatalog()" type="text" placeholder="Tovar qidirish..." class="border border-slate-300 bg-white rounded-xl px-3.5 py-2 text-sm w-full sm:w-64 focus:border-emerald-500 focus:outline-none">
    </div>

    <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- Savat paneli -->
  <div id="cart-drawer" class="fixed inset-0 z-50 hidden">
    <div onclick="toggleCart(false)" class="fixed inset-0 bg-black/50 backdrop-blur-xs"></div>
    <aside class="fixed right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col justify-between z-10">
      <div class="p-5 border-b border-slate-200 flex items-center justify-between">
        <h3 class="text-lg font-extrabold text-slate-900"><i class="fas fa-shopping-cart text-emerald-600 mr-2"></i> Savat</h3>
        <button onclick="toggleCart(false)" class="text-slate-500 hover:text-slate-800 text-xl">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-3"></div>

      <form onsubmit="submitPurchase(event)" class="p-5 border-t border-slate-200 bg-slate-50 space-y-3">
        <div class="flex justify-between items-center text-base font-extrabold text-slate-900">
          <span>Jami to‘lov:</span>
          <span id="cart-total" class="text-emerald-700">0 so'm</span>
        </div>

        <input id="buyer-name" type="text" required placeholder="Ismingiz" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:border-emerald-500 focus:outline-none">
        <input id="buyer-phone" type="tel" required placeholder="Telefon raqamingiz (+998 90 ...)" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:border-emerald-500 focus:outline-none">

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl shadow transition">
          Xaridni rasmiylashtirish
        </button>
      </form>
    </aside>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-2 text-sm font-semibold">
    <i class="fas fa-check-circle text-emerald-400"></i>
    <span id="toast-msg">Tayyor!</span>
  </div>

  <script>
    const STORE_KEY = 'dokon_tizim_v1';
    const channel = new BroadcastChannel('dokon_sync_channel');

    const initialData = {
      products: [
        { id: 1, name: "Simsiz quloqchin", price: 185000, stock: 15, desc: "Uzoq quvvat saqlovchi zamonaviy quloqchin." },
        { id: 2, name: "Aqlli soat (Smart Watch)", price: 320000, stock: 10, desc: "Bildirishnomalar va kunlik faollik nazorati." },
        { id: 3, name: "Powerbank 20 000 mAh", price: 240000, stock: 20, desc: "Tezkor quvvatlash funksiyali portativ batareya." },
        { id: 4, name: "USB-C tez quvvatlagich", price: 95000, stock: 30, desc: "Smartfon va planshetlar uchun xavfsiz adapter." }
      ],
      cart: [],
      purchases: []
    };

    function getState() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) {
          localStorage.setItem(STORE_KEY, JSON.stringify(initialData));
          return structuredClone(initialData);
        }
        return { ...structuredClone(initialData), ...JSON.parse(raw) };
      } catch {
        return structuredClone(initialData);
      }
    }

    function setState(nextState, broadcast = true) {
      localStorage.setItem(STORE_KEY, JSON.stringify(nextState));
      if (broadcast) channel.postMessage({ type: 'UPDATED' });
    }

    function formatSum(n) {
      return Number(n || 0).toLocaleString('uz-UZ') + " so'm";
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      el.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => el.classList.add('translate-y-20', 'opacity-0'), 2600);
    }

    function toggleCart(open) {
      document.getElementById('cart-drawer').classList.toggle('hidden', !open);
      renderCart();
    }

    function addToCart(id) {
      const state = getState();
      const prod = state.products.find(p => p.id === id);
      if (!prod || prod.stock <= 0) return;

      const existing = state.cart.find(c => c.id === id);
      const currentQty = existing ? existing.qty : 0;
      if (currentQty + 1 > prod.stock) {
        showToast("Omborda yetarli tovar qolmagan!");
        return;
      }

      if (existing) existing.qty += 1;
      else state.cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });

      setState(state);
      renderAll();
      showToast(`${prod.name} savatga qo‘shildi`);
    }

    function changeQty(id, delta) {
      const state = getState();
      const idx = state.cart.findIndex(c => c.id === id);
      if (idx === -1) return;

      const prod = state.products.find(p => p.id === id);
      const nextQty = state.cart[idx].qty + delta;

      if (nextQty <= 0) state.cart.splice(idx, 1);
      else if (prod && nextQty > prod.stock) {
        showToast("Ombordagi miqdordan oshmasin!");
        return;
      } else state.cart[idx].qty = nextQty;

      setState(state);
      renderAll();
    }

    function submitPurchase(e) {
      e.preventDefault();
      const state = getState();
      if (!state.cart.length) {
        showToast("Avval savatga tovar qo‘shing!");
        return;
      }

      const buyerName = document.getElementById('buyer-name').value.trim();
      const buyerPhone = document.getElementById('buyer-phone').value.trim();
      const total = state.cart.reduce((s, item) => s + item.price * item.qty, 0);
      const itemsSummary = state.cart.map(item => `${item.name} (${item.qty} dona — ${formatSum(item.price * item.qty)})`).join(', ');

      state.cart.forEach(cartItem => {
        const prod = state.products.find(p => p.id === cartItem.id);
        if (prod) prod.stock = Math.max(0, prod.stock - cartItem.qty);
      });

      state.purchases.unshift({
        id: "X-" + Math.floor(1000 + Math.random() * 9000),
        date: new Date().toLocaleString('uz-UZ'),
        buyerName,
        buyerPhone,
        items: state.cart.map(i => ({ name: i.name, price: i.price, qty: i.qty })),
        summary: itemsSummary,
        total,
        status: "Yangi"
      });

      state.cart = [];
      document.getElementById('buyer-name').value = '';
      document.getElementById('buyer-phone').value = '';

      setState(state);
      toggleCart(false);
      renderAll();
      showToast("Xaridingiz rasmiylashtirildi va adminga yuborildi!");
    }

    function renderCatalog() {
      const state = getState();
      const q = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
      const list = state.products.filter(p => !q || p.name.toLowerCase().includes(q) || (p.desc || '').toLowerCase().includes(q));

      document.getElementById('catalog-grid').innerHTML = list.length ? list.map(p => `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-xs font-bold px-2.5 py-1 rounded-full ${p.stock > 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">
                ${p.stock > 0 ? `Sotuvda bor (${p.stock} ta)` : 'Tugagan'}
              </span>
            </div>
            <h3 class="text-lg font-extrabold text-slate-900">${p.name}</h3>
            <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">${p.desc || ''}</p>
          </div>

          <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between">
            <span class="text-base font-extrabold text-slate-900">${formatSum(p.price)}</span>
            <button onclick="addToCart(${p.id})" ${p.stock <= 0 ? 'disabled' : ''} class="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white text-xs sm:text-sm font-bold px-4 py-2 rounded-xl transition flex items-center space-x-1.5">
              <i class="fas fa-cart-plus"></i>
              <span>Savatga</span>
            </button>
          </div>
        </div>
      `).join('') : `<p class="text-sm text-slate-400 col-span-full text-center py-10">Hozircha tovarlar yo‘q.</p>`;
    }

    function renderCart() {
      const state = getState();
      const qty = state.cart.reduce((s, i) => s + i.qty, 0);
      const total = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
      document.getElementById('cart-badge').innerText = qty;
      document.getElementById('cart-total').innerText = formatSum(total);

      const el = document.getElementById('cart-items');
      if (!state.cart.length) {
        el.innerHTML = `<p class="text-sm text-slate-400 text-center py-10">Savatingiz bo‘sh</p>`;
        return;
      }

      el.innerHTML = state.cart.map(i => `
        <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
          <div>
            <p class="text-sm font-bold text-slate-800">${i.name}</p>
            <p class="text-xs text-slate-500">${formatSum(i.price * i.qty)}</p>
          </div>
          <div class="flex items-center space-x-2">
            <button type="button" onclick="changeQty(${i.id}, -1)" class="w-7 h-7 rounded-lg bg-slate-200 font-bold text-sm">-</button>
            <span class="text-sm font-extrabold w-5 text-center">${i.qty}</span>
            <button type="button" onclick="changeQty(${i.id}, 1)" class="w-7 h-7 rounded-lg bg-emerald-500 text-slate-950 font-bold text-sm">+</button>
          </div>
        </div>
      `).join('');
    }

    function renderAll() {
      renderCatalog();
      renderCart();
    }

    window.addEventListener('storage', (e) => {
      if (e.key === STORE_KEY) renderAll();
    });
    channel.onmessage = () => renderAll();

    renderAll();
  </script>
</body>
</html>
